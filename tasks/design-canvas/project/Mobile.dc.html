<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>KnowledgeLLM 手機版對話</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#edf0f3}a:hover{color:#ffffff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #202326; color: #edf0f3; font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.5">

<header style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #48535f">
<span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: #292e35; border: 1px solid #48535f">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e3be73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6"></path><path d="M12 19h8"></path></svg>
</span>
<span style="flex: 1; font-weight: 600; font-size: 16px">KnowledgeLLM</span>
<button type="button" aria-label="切換身分，目前為 Alex，財務" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px 4px 6px; border-radius: 30px; border: 1px solid {{accent}}; background: #292e35; color: #edf0f3; font: inherit; font-size: 14px; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: {{accent}}; color: #202326; font-weight: 600; font-size: 13px">A</span>
<span>Alex · 財務</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#adb8c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</header>

<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px 16px">
<div style="align-self: flex-end; max-width: 84%; padding: 10px 14px; border-radius: 14px 14px 4px 14px; background: #292e35; border: 1px solid #48535f; font-size: 16px">每晚住宿補助是多少？</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 16px; line-height: 1.7">標準商務旅館的費用上限為每晚 <strong style="font-weight: 600">200 點</strong>，而且須至少提前 14 天訂房。</p>
<button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1px solid {{accent}}; background: #25292d; color: #edf0f3; font: inherit; text-align: left; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; background: {{accent}}; color: #202326; font-family: 'IBM Plex Mono', monospace; font-size: 12px">1</span>
<span style="flex: 1; font-size: 14px; font-weight: 600">公司費用報銷政策</span>
<span style="font-size: 12px; color: #adb8c6">財務</span>
</button>
<div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px">
<span style="padding: 4px 10px; border-radius: 20px; border: 1px solid #48535f; color: #39bd7b">未偵測到個資</span>
<span style="padding: 4px 10px; border-radius: 20px; border: 1px solid #48535f; color: #e3be73">快取命中</span>
</div>
</div>
</div>

<div aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: #14171a; opacity: 0.55"></div>

<section aria-label="來源內容" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 468px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 10px 18px 22px; border-radius: 18px 18px 0 0; border-top: 1px solid #48535f; background: #25292d">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #48535f"></span>
<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{accent}}; letter-spacing: 0.4px">來源 1 · 財務</span>
<h2 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35">公司費用報銷政策</h2>
</div>
<button type="button" aria-label="關閉來源內容" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #48535f; background: transparent; color: #adb8c6; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.7">
<h3 style="margin: 0; font-size: 14px; font-weight: 600">3. 差旅與餐費規範</h3>
<p style="margin: 0; color: #adb8c6">航班：飛行時間少於 6 小時的國內及區域航班，必須搭乘經濟艙。商務艙須事先取得副總裁核准。</p>
<p style="margin: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid {{accent}}; background: #202326; color: #edf0f3">住宿：標準商務旅館費用上限為 200 點／晚。須至少提前 14 天訂房。</p>
</div>
<a href="#top" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 10px; border: 1px solid #48535f; font-size: 15px; text-decoration: none">
<span>開啟完整文件</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ed9678","options":["#ed9678","#62b7c3","#b79bde"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#ed9678' };
}
}
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="100%" height="100%" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gradFast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradEmbed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradQdrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gradPrompt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradGroq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>

    <!-- Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="44" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="-0.5">KnowledgeLLM · Advanced RAG &amp; Cache Architecture</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13">Sub-20ms Exact-Match Cache · 1024-Dim Cohere Embeddings · Scoped Vector Search · Grounded Inference</text>

  <!-- ================= 01. QUESTION / CLIENT ================= -->
  <g transform="translate(40, 110)">
    <rect width="180" height="90" rx="10" fill="url(#gradCard)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="8" height="8" rx="4" fill="#38bdf8"/>
    <text x="30" y="22" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">Input Query</text>
    <text x="14" y="48" fill="#f8fafc" font-size="14" font-weight="600">User Question</text>
    <text x="14" y="68" fill="#64748b" font-size="11">+ Cognito JWT Claims</text>
    <rect x="14" y="74" width="152" height="4" rx="2" fill="#0284c7" opacity="0.4"/>
  </g>

  <!-- Decision Branch -->
  <!-- Arrow 1: Question to Cache Check -->
  <path d="M 220 155 L 265 155" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 02. DYNAMODB CACHE (FAST PATH) ================= -->
  <g transform="translate(270, 105)">
    <rect width="180" height="100" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="24" fill="#34d399" font-size="11" font-weight="700">⚡ FAST PATH</text>
    <text x="16" y="46" fill="#f8fafc" font-size="14" font-weight="700">DynamoDB Cache</text>
    <text x="16" y="66" fill="#a7f3d0" font-size="11">Exact Match (15 Prompts)</text>
    <text x="16" y="84" fill="#6ee7b7" font-size="11" font-weight="600">⏱ ~15ms · 0 Tokens · $0</text>
  </g>

  <!-- Cache Hit Path to Output (top arch) -->
  <path d="M 450 155 Q 520 155 750 155 T 1030 155" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>
  <rect x="680" y="140" width="130" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="745" y="156" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Cache HIT (Bypass RAG)</text>

  <!-- Cache Miss Arrow down to Embedding -->
  <path d="M 360 205 L 360 260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="240" fill="#f43f5e" font-size="11" font-weight="600">Cache MISS</text>

  <!-- ================= 03. EMBEDDING MODEL ================= -->
  <g transform="translate(260, 270)">
    <rect width="200" height="110" rx="10" fill="url(#gradCard)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="8" height="8" rx="4" fill="#38bdf8"/>
    <text x="28" y="22" fill="#38bdf8" font-size="11" font-weight="600">AWS BEDROCK</text>
    <text x="14" y="48" fill="#f8fafc" font-size="14" font-weight="600">Cohere Embed v3</text>
    <text x="14" y="68" fill="#94a3b8" font-size="11">Multilingual · Singapore</text>
    <text x="14" y="86" fill="#38bdf8" font-size="11" font-weight="600">&lt;200ms · No Cold Download</text>
  </g>

  <!-- Arrow to Dense Vector -->
  <path d="M 460 325 L 495 325" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ================= 04. DENSE VECTOR ================= -->
  <g transform="translate(500, 280)">
    <rect width="130" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="24" fill="#94a3b8" font-size="10" font-weight="600">DENSE VECTOR</text>
    <text x="14" y="44" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="600">[ 0.012,</text>
    <text x="14" y="60" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="600"> -0.045,</text>
    <text x="14" y="76" fill="#64748b" font-size="11">... 1024 dims ]</text>
  </g>

  <!-- Arrow down to Qdrant -->
  <path d="M 565 370 L 565 410" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 05. QDRANT VECTOR DB ================= -->
  <g transform="translate(480, 420)">
    <rect width="170" height="110" rx="10" fill="url(#gradCard)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Cylinder Icon -->
    <ellipse cx="28" cy="24" rx="12" ry="5" fill="#4f46e5"/>
    <rect x="16" y="24" width="24" height="14" fill="#4f46e5"/>
    <ellipse cx="28" cy="38" rx="12" ry="5" fill="#4338ca"/>

    <text x="48" y="26" fill="#818cf8" font-size="11" font-weight="600">QDRANT CLOUD</text>
    <text x="48" y="44" fill="#f8fafc" font-size="14" font-weight="600">Vector Search</text>
    <rect x="14" y="58" width="142" height="22" rx="4" fill="#312e81"/>
    <text x="20" y="73" fill="#c7d2fe" font-size="10" font-weight="600">🔒 filter: dept == claims</text>
    <text x="14" y="98" fill="#94a3b8" font-size="10">Cosine Similarity · Top 5</text>
  </g>

  <!-- Retrieval Arrow from Qdrant up-right to Context Assembly -->
  <path d="M 650 460 Q 720 460 720 380" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="440" fill="#a5b4fc" font-size="11" font-weight="600">Scoped Retrieval</text>

  <!-- ================= 06. CONTEXT ASSEMBLY ================= -->
  <g transform="translate(680, 230)">
    <rect width="190" height="200" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="12" y="12" width="166" height="34" rx="6" fill="#78350f" stroke="#b45309" stroke-width="1"/>
    <text x="22" y="28" fill="#fef3c7" font-size="11" font-weight="700">System Prompt</text>
    <text x="22" y="40" fill="#fde68a" font-size="9">Strict Grounding · JSON Schema</text>

    <!-- Chunks box -->
    <rect x="12" y="54" width="166" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="70" fill="#94a3b8" font-size="10" font-weight="600">Retrieved &amp; Masked Context</text>
    <rect x="20" y="78" width="150" height="16" rx="3" fill="#334155"/>
    <text x="26" y="90" fill="#e2e8f0" font-size="9">Chunk 1: [expense-policy.md]</text>
    <rect x="20" y="98" width="150" height="16" rx="3" fill="#334155"/>
    <text x="26" y="110" fill="#e2e8f0" font-size="9">Chunk 2: [q4-budget.md]</text>
    <text x="26" y="128" fill="#64748b" font-size="9">+ Source PII Redaction</text>

    <!-- User Question -->
    <rect x="12" y="146" width="166" height="38" rx="6" fill="#374151"/>
    <text x="20" y="162" fill="#9ca3af" font-size="10" font-weight="600">User Question</text>
    <text x="20" y="176" fill="#f3f4f6" font-size="10">"When must expense reports..."</text>
  </g>

  <!-- Arrow to Groq -->
  <path d="M 870 330 L 910 330" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ================= 07. GROQ LLM ================= -->
  <g transform="translate(915, 275)">
    <rect width="140" height="110" rx="10" fill="url(#gradCard)" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="8" height="8" rx="4" fill="#fb923c"/>
    <text x="28" y="22" fill="#fb923c" font-size="11" font-weight="700">GROQ CLOUD</text>
    <text x="14" y="48" fill="#f8fafc" font-size="14" font-weight="700">gpt-oss-20b</text>
    <text x="14" y="68" fill="#fdba74" font-size="11">temp=0 · Ultra-fast</text>
    <text x="14" y="86" fill="#fed7aa" font-size="11">JSON + Citation IDs</text>
  </g>

  <!-- Arrow to Verification & Response -->
  <path d="M 985 275 L 985 200 L 1030 200" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 08. FINAL RESPONSE ================= -->
  <g transform="translate(1040, 110)">
    <rect width="160" height="140" rx="10" fill="url(#gradCard)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="8" height="8" rx="4" fill="#34d399"/>
    <text x="28" y="22" fill="#34d399" font-size="11" font-weight="700">VALIDATED OUTPUT</text>
    <text x="14" y="48" fill="#f8fafc" font-size="14" font-weight="700">Grounded Answer</text>
    
    <rect x="14" y="62" width="132" height="24" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
    <text x="22" y="78" fill="#a7f3d0" font-size="10" font-weight="600">✓ Citations Checked</text>
    
    <rect x="14" y="92" width="132" height="20" rx="4" fill="#1e293b"/>
    <text x="22" y="106" fill="#94a3b8" font-size="10">🛡 Output PII Passed</text>
    
    <text x="14" y="130" fill="#6ee7b7" font-size="10" font-weight="600">HTTP 200 OK</text>
  </g>

  <!-- Background Ingestion Ribbon -->
  <g transform="translate(40, 480)">
    <rect width="400" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="14" y="20" fill="#94a3b8" font-size="10" font-weight="700">BACKGROUND INGESTION PIPELINE</text>
    <text x="14" y="38" fill="#64748b" font-size="11">S3 Markdown ──(EventBridge)──&gt; Ingestion Lambda ──&gt; Cohere ──&gt; Qdrant + S3 Manifests</text>
  </g>
</svg>

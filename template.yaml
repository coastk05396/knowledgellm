AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Permission-aware KnowledgeLLM assistant — uses isolated hybrid retrieval with server-side BM25 and retains the dense collection for rollback.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Cognito-authorized chat and S3 ingestion Lambdas -> Qdrant Cloud hybrid retrieval -> Groq grounded answers; DynamoDB caches fixed demo questions.
    must:
      - Chat and ingestion use the same hybrid collection and manifest identity.
      - Keep answer caching disabled until hybrid indexing and chat cutover are verified.
      - Preserve the existing dense collection for rollback; never mix vector schemas.

Parameters:
  AnswerCacheEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable only after validating all migrated Qdrant Cloud Inference document versions
  DemoMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Public fictional demo access only; custom authentication is denied otherwise
  CognitoDomainPrefix:
    Type: String
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Globally unique prefix for the managed Cognito login domain
  WebCallbackUrl:
    Type: String
    Default: http://localhost:5173/
    Description: Exact OAuth callback URI registered in the web app client
  WebLogoutUrl:
    Type: String
    Default: http://localhost:5173/
    Description: Exact post-logout URI registered in the web app client
  QdrantUrl:
    Type: String
    Description: Qdrant cluster URL
  QdrantApiKeySecretArn:
    Type: String
    Description: ARN of the Qdrant API key stored in Secrets Manager
  GroqApiKeySecretArn:
    Type: String
    Description: ARN of the Groq API key stored in Secrets Manager
  GroqModel:
    Type: String
    Default: openai/gpt-oss-20b
    Description: Configured Groq model ID; check current model availability before deployment
  GroqInputRatePerMillionUsd:
    Type: String
    Default: ''
    Description: Current configured input token price per million USD; blank hides cost estimates
  GroqOutputRatePerMillionUsd:
    Type: String
    Default: ''
    Description: Current configured output token price per million USD; blank hides cost estimates
  WebOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact browser origin allowed to call the API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 20
    MemorySize: 512
    Environment:
      Variables:
        PYTHONPATH: /var/task/src
        DOCUMENTS_BUCKET: !Ref DocumentsBucket
        QDRANT_URL: !Ref QdrantUrl
        QDRANT_API_KEY_SECRET_ARN: !Ref QdrantApiKeySecretArn
        QDRANT_COLLECTION: knowledgellm-qdrant-hybrid-e5-small
        EMBEDDING_MODEL: intfloat/multilingual-e5-small
        GROQ_API_KEY_SECRET_ARN: !Ref GroqApiKeySecretArn
        GROQ_MODEL: !Ref GroqModel
        GROQ_INPUT_RATE_PER_MILLION_USD: !Ref GroqInputRatePerMillionUsd
        GROQ_OUTPUT_RATE_PER_MILLION_USD: !Ref GroqOutputRatePerMillionUsd

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      LambdaConfig:
        DefineAuthChallenge: !GetAtt DemoAuthFunction.Arn
        CreateAuthChallenge: !GetAtt DemoAuthFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt DemoAuthFunction.Arn
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7

  DemoAuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-demo-auth'
      RetentionInDays: 7

  DemoAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-demo-auth'
      CodeUri: api/src/knowledgellm/
      Handler: auth_challenge.handler
      Runtime: python3.12
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          DEMO_MODE: !Ref DemoMode
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref DemoAuthLogGroup

  CognitoDemoAuthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DemoAuthFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn
      SourceAccount: !Ref AWS::AccountId

  FinanceGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: finance
      UserPoolId: !Ref CognitoUserPool

  OperationsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operations
      UserPoolId: !Ref CognitoUserPool

  PeopleGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: people
      UserPoolId: !Ref CognitoUserPool

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: KnowledgeLLM web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_CUSTOM_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - profile
        - email
      CallbackURLs:
        - !Ref WebCallbackUrl
      LogoutURLs:
        - !Ref WebLogoutUrl
      SupportedIdentityProviders:
        - COGNITO

  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool
      ManagedLoginVersion: 2

  CognitoManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref CognitoUserPoolClient
      UseCognitoProvidedValues: true

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  AnswerCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ChatQuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  KnowledgeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref WebOrigin
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}'
              audience:
                - !Ref CognitoUserPoolClient

  KnowledgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: knowledgellm.handler.handler
      Environment:
        Variables:
          CHAT_QUOTA_TABLE: !Ref ChatQuotaTable
          ANSWER_CACHE_TABLE: !Ref AnswerCacheTable
          ANSWER_CACHE_ENABLED: !Ref AnswerCacheEnabled
      Timeout: 28
      MemorySize: 1024
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:GetObjectVersion]
              Resource: !Sub '${DocumentsBucket.Arn}/*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref QdrantApiKeySecretArn
                - !Ref GroqApiKeySecretArn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt AnswerCacheTable.Arn
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ChatQuotaTable.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref KnowledgeApi
            Path: /health
            Method: GET
        ListDocuments:
          Type: HttpApi
          Properties:
            ApiId: !Ref KnowledgeApi
            Path: /documents
            Method: GET
            Auth:
              Authorizer: CognitoJwt
        OpenDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref KnowledgeApi
            Path: /documents/{documentId}
            Method: GET
            Auth:
              Authorizer: CognitoJwt
        AskQuestion:
          Type: HttpApi
          Properties:
            ApiId: !Ref KnowledgeApi
            Path: /chat
            Method: POST
            RouteSettings:
              ThrottlingRateLimit: 1
              ThrottlingBurstLimit: 5
            Auth:
              Authorizer: CognitoJwt

  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: knowledgellm.ingest.handler
      Timeout: 180
      MemorySize: 2048
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:GetObjectVersion]
              Resource: !Sub '${DocumentsBucket.Arn}/*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref QdrantApiKeySecretArn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${DocumentsBucket.Arn}/_indexes/knowledgellm-qdrant-hybrid-e5-small/*'
      Events:
        ObjectCreated:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref DocumentsBucket
                object:
                  key:
                    - prefix: finance/
                    - prefix: operations/
                    - prefix: people/

Outputs:
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}'
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  CognitoDomainUrl:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ApiUrl:
    Value: !Sub 'https://${KnowledgeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  AnswerCacheTableName:
    Value: !Ref AnswerCacheTable

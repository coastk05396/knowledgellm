[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgellm-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.38,<2",
  "pypdf>=6,<7",
  "groq>=0.31,<1",
  "qdrant-client>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "reportlab>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledgellm = ["sample_docs/**/*.md", "sample_docs/**/*.pdf", "demo_questions.json"]
